<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Capture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 12px;
    user-select: none;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.1);
    cursor: move;
    -webkit-app-region: drag;
  }
  .header h1 { font-size: 13px; font-weight: 600; opacity: .8; }
  .header .close {
    width: 24px; height: 24px; border-radius: 6px;
    display: grid; place-items: center;
    background: transparent; border: none; color: rgba(255,255,255,.5);
    cursor: pointer; font-size: 14px;
    -webkit-app-region: no-drag;
  }
  .header .close:hover { background: rgba(255,255,255,.1); color: #fff; }
  .body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 14px;
    color: #fff; font-size: 14px; line-height: 1.6;
    font-family: inherit;
  }
  textarea:focus { border-color: #ff2e88; }
  textarea::placeholder { color: rgba(255,255,255,.3); }
  .footer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .footer .hint { flex: 1; font-size: 11px; color: rgba(255,255,255,.4); }
  .footer button {
    padding: 8px 18px; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .btn-save {
    background: #ff2e88; color: #fff;
  }
  .btn-save:hover { background: #ff5ca1; transform: translateY(-1px); }
  .btn-cancel {
    background: rgba(255,255,255,.1); color: rgba(255,255,255,.7);
  }
  .btn-cancel:hover { background: rgba(255,255,255,.15); }
  .saved-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85); color: #fff;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .saved-toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ Quick Capture</h1>
    <button class="close" onclick="window.pywebview.api.close_window()">✕</button>
  </div>
  <div class="body">
    <textarea id="captureInput" placeholder="What's on your mind? Type it here…" autofocus></textarea>
  </div>
  <div class="footer">
    <span class="hint">Ctrl+Enter to save · Esc to close</span>
    <button class="btn-cancel" onclick="window.pywebview.api.close_window()">Cancel</button>
    <button class="btn-save" onclick="saveCapture()">Save</button>
  </div>
  <div class="saved-toast" id="savedToast">✓ Saved to Quick Notes</div>

<script>
  const input = document.getElementById('captureInput');
  const toast = document.getElementById('savedToast');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      saveCapture();
    }
    if (e.key === 'Escape') {
      window.pywebview.api.close_window();
    }
  });

  async function saveCapture() {
    const text = input.value.trim();
    if (!text) return;

    await window.pywebview.api.save_capture(text);

    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
      input.value = '';
      setTimeout(() => window.pywebview.api.close_window(), 300);
    }, 800);
  }

  // Focus input on load
  window.addEventListener('load', () => input.focus());
</script>
</body>
</html>

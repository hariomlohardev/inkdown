[project]
name = "inkdown"
version = "1.1.0"
description = "The Notion-inspired Markdown studio for writers who care about craft"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inkdown" }]
keywords = ["markdown", "editor", "notion", "pywebview", "writing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Text Editors",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "pywebview>=5.0",
  "pillow>=10.0",
  "pystray>=0.19.5",
  "keyboard>=0.13.5",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/hariomlohardev/inkdown"
Repository = "https://github.com/hariomlohardev/inkdown"
Issues = "https://github.com/hariomlohardev/inkdown/issues"

[project.scripts]
inkdown = "inkdown.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkdown = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

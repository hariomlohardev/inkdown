name: Deploy Inkdown

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site
        run: |
          test -f app/index.html || (echo "app/index.html missing" && exit 1)
          test -f app/src/scripts/main.js || (echo "app/src/scripts/main.js missing" && exit 1)
          echo "Site OK — $(find app -type f | wc -l) files in app/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify imports
        run: |
          python -c "import inkdown; print(inkdown.__version__)"
        env:
          PYTHONPATH: src

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Check syntax
        run: |
          python -m py_compile src/inkdown/__main__.py src/inkdown/daemon.py src/inkdown/file_lock.py
          python -m py_compile src/inkdown/watchdog.py src/inkdown/updater.py

      - name: Verify app
        run: |
          test -f app/index.html
          test -f app/src/scripts/main.js
          test -f app/src/styles/main.css
          echo "app/ OK"

  build-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller pywebview pillow
      - run: python scripts/make_icon.py --help 2>&1 | head -n 5 || python scripts/make_icon.py 2>&1 | head -n 10
      - run: python scripts/fetch_vendor.py 2>&1 | tail -n 10
